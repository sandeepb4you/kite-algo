# =============================================================================
# Template for the SECRETS file. The real secrets file lives OUTSIDE the repo
# (default ~/.trading/secrets.yaml) so credentials never travel with the code.
#
# Create it automatically with:
#     ./tradebot -init-secrets
# ...or copy this template there and fill in the values manually:
#     cp secrets.example.yaml ~/.trading/secrets.yaml
#
# This file (secrets.example.yaml) is safe to commit — it has no real secrets.
# =============================================================================

# Zerodha Kite credentials. Get api_key / api_secret from
# https://developers.kiteconnect.com/apps. The access_token is obtained once a
# day from the login flow (the login URL is printed on startup when missing).
kite:
  api_key: ""
  api_secret: ""
  access_token: ""
