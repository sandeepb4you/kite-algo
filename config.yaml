# =============================================================================
# Trading platform configuration.
# Copy this file to config.yaml and edit. Secrets can also come from env vars
# (KITE_API_KEY, KITE_API_SECRET, KITE_ACCESS_TOKEN), which override the values
# here — preferred so credentials never sit in a checked-in file.
# =============================================================================

# Execution mode:
#   dryrun : no credentials, no network. Boots and idles (smoke test).
#   paper  : live market data, SIMULATED orders. Recommended for development.
#   live   : REAL orders. Requires live_confirm: true AND typing "I UNDERSTAND".
mode: live

# Logging. level: debug|info|warn|error. format: text|json
log:
  level: info
  format: text

# --- Zerodha Kite endpoints ---------------------------------------------------
#
# ⚠️ THIS FILE IS COMMITTED TO GIT. LEAVE THE THREE CREDENTIAL FIELDS EMPTY.
#
# They exist only as a last-resort fallback. Put real values in the secrets file
# (~/.trading/secrets.yaml, created by `tradebot -init-secrets`) or in the
# KITE_API_KEY / KITE_API_SECRET environment variables — both override this file.
#
# access_token is not needed at all: the web UI performs the Zerodha login and
# stores the token in the database, refreshing it each trading day.
kite:
  api_key: ""
  api_secret: ""
  access_token: ""
  base_url: "https://api.kite.trade"
  ticker_url: "wss://ws.kite.trade"

# SAFETY: must be true to even attempt live mode. Even then the process starts
# with a simulated broker — nothing reaches the exchange until you type
# "I UNDERSTAND" and re-enter your password in the web UI.
live_confirm: true

# Record every tick to the database? This is HUGE (lakhs of rows/day) — leave
# off unless you're collecting data for backtesting.
recording:
  ticks: false

# Daily option-candle capture.
#
# Kite sells no historical data for EXPIRED contracts: candles are keyed by
# instrument_token, and an expired option's token leaves the instrument master
# for good. A weekly option's data is buyable up to expiry and gone forever the
# day after. This job downloads it while the contracts are still alive — a day
# it does not run is a day of option data nobody can ever backtest.
capture:
  enabled: true
  run_at: "15:40"          # IST, after the 15:30 close so the last bar is settled
  interval: "5minute"
  strikes: 20              # strikes captured EACH SIDE of the day's traded range
  expiries: 4              # how many expiries deep, nearest first
  lookback_days: 30        # first sighting of a contract reaches back this far;
                           # coverage means it is paid once, not daily
  underlyings:
    - name: "NIFTY"        # as it appears in the instrument master (NFO)
      index: "NIFTY 50"    # spot symbol that centres the strike window
    - name: "SENSEX"       # BSE — requires the BFO master, loaded automatically
      index: "SENSEX"
  # Weekends are skipped structurally. Holidays are not derivable — list them
  # or the job spends a few empty requests on each one.
  # NSE/BSE trading holidays. Equity and equity-derivative segments share one
  # list, so this serves both NFO and BFO capture.
  #
  # Weekends are handled structurally; these are not derivable and must be
  # listed. Getting one WRONG is asymmetric: an unlisted holiday costs a few
  # empty requests and a spurious login nag, while a date listed here that is
  # actually a trading day makes the capture SKIP it, and an expired contract's
  # candles cannot be fetched again afterwards. When in doubt, leave it out.
  #
  # 2026, verified against two independent published lists. Re-check against
  # nseindia.com/resources/exchange-communication-holidays each December, and
  # note that election holidays are announced mid-year — 15 Jan 2026 was one.
  holidays:
    - "2026-01-15"  # Maharashtra municipal elections
    - "2026-01-26"  # Republic Day
    - "2026-03-03"  # Holi
    - "2026-03-26"  # Shri Ram Navami
    - "2026-03-31"  # Shri Mahavir Jayanti
    - "2026-04-03"  # Good Friday
    - "2026-04-14"  # Dr Baba Saheb Ambedkar Jayanti
    - "2026-05-01"  # Maharashtra Day
    - "2026-05-28"  # Bakri Id
    - "2026-06-26"  # Muharram
    - "2026-09-14"  # Ganesh Chaturthi
    - "2026-10-02"  # Mahatma Gandhi Jayanti
    - "2026-10-20"  # Dussehra
    - "2026-11-10"  # Diwali Balipratipada
    - "2026-11-24"  # Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"  # Christmas
  # Note: Diwali Laxmi Pujan falls on Sunday 8 Nov 2026 with a special Muhurat
  # session. Weekends are skipped structurally, so that session is not captured.

# SQLite database location. Directory is created if missing.
storage:
  sqlite_path: "./data/trading.db"

# Pre-trade risk limits. Tune to your capital and risk appetite.
risk:
  max_daily_loss: 5000          # rupees: halt NEW entries when day PnL <= -this

  # 0 = no limit. Sizing caps are deliberately off: the daily loss cap measures
  # what is actually at stake, where these three only proxy for it.
  #
  # The lot-MULTIPLE check is deliberately unaffected by this: it is validity,
  # not sizing, so a quantity that is not a multiple of the lot size is still
  # rejected here rather than on a round trip to the exchange.
  max_open_positions: 0         # was 5 (distinct open symbols)
  max_order_value: 0            # was 100000 (rupees per single order)
  max_lots_per_trade: 0         # was 1

  # --- REAL book -------------------------------------------------------------
  # Derived and LOCKED. Unlike `paper` below, none of this is editable from the
  # UI: a limit you can loosen from a browser at the moment it starts hurting is
  # not a limit. Changing any of it means editing this file and restarting.
  live:
    # Daily loss cap as a percentage of the account's OPENING balance,
    # snapshotted once per trading day. A percentage so the limit tracks the
    # account; snapshotted because available margin FALLS as a position moves
    # against you, and a live-derived limit would tighten exactly when you are
    # already hurting.
    #
    # Breaching it locks out new live ENTRIES for the rest of the day. The
    # lockout is persisted, so a restart does not clear it. Exits always remain
    # allowed.
    max_loss_pct: 1.0

    # IST time at which open REAL positions in contracts expiring TODAY are
    # squared off. Expiry-day gamma makes a position that looked small at noon
    # very large by the close. Set to "off" to disable.
    #
    # Simulated positions are never touched: they are the point of a
    # simulation and are left to run.
    expiry_square_off_time: "15:00"
  # Limits for the SIMULATED book, which runs alongside the real one: manual
  # orders can be routed to the exchange while every strategy stays on paper.
  #
  # Separate because the two hold different money. A strategy under evaluation
  # should be allowed to lose more than you would risk by hand, and a simulated
  # blow-up must not block your real manual trading. Unset fields inherit the
  # real limits above.
  paper:
    max_daily_loss: 25000
    # max_lots_per_trade is intentionally unset. An override only applies when
    # it is > 0, so any value here would put the cap back on the simulated book
    # — which in paper mode is where every order goes.

# Strategy instances. Set enabled: true to activate.
strategies:
  - name: "short-straddle"
    enabled: true
    params:
      index_symbol: "NIFTY 50"   # spot index to track (drives entry)
      underlying: "NIFTY"        # option underlying to trade
      strike_step: 50            # NIFTY grid (use 100 for BANKNIFTY)
      lots: 1                    # lots per leg (1 = 75 qty for NIFTY)
      entry_start_time: "09:20"  # no entry before this IST time: the first
                                 # minutes carry the widest spreads of the day
                                 # and the ATM strike is still moving
      exit_delta: 0.25           # square off when |net position delta| > this
      risk_free_rate: 0.06       # annualized, for Black-Scholes
      square_off_time: "15:15"   # flat by this IST time, regardless of delta
      product: "MIS"             # MIS (intraday) or NRML
