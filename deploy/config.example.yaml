# Deployment config. Copy to deploy/config.yaml and edit.
#
# Differs from the repo-root config.example.yaml in three ways that matter in a
# container, all of them marked CONTAINER below.

mode: paper          # paper until you have watched it run; then live
live_confirm: false  # must be true before the live desk can be armed

log:
  level: info
  format: json       # CONTAINER: structured logs for `docker compose logs`

kite:
  api_key: ""        # leave empty: comes from secrets.yaml
  api_secret: ""
  access_token: ""
  base_url: "https://api.kite.trade"
  ticker_url: "wss://ws.kite.trade"

web:
  # CONTAINER: bind every interface INSIDE the container so Caddy, which is a
  # different container, can reach it. This is not exposed to the host or the
  # internet — see the `expose:` (not `ports:`) stanza in docker-compose.yml.
  #
  # The application refuses to start on a non-loopback address with no password
  # set, which is the check that stops this being a mistake.
  addr: "0.0.0.0:8080"

  # CONTAINER: must equal SITE_ADDRESS in .env, with the scheme.
  # <public_url>/kite/callback goes in the Kite developer console verbatim.
  public_url: "https://kite.example.com"

  password_hash: ""  # leave empty: comes from secrets.yaml

  # CONTAINER: Caddy fronts the app, so the peer address is always Caddy's.
  # Without this the login lockout and the live-arming lockout key off one
  # address for everybody, making the throttle global instead of per-attacker.
  trust_proxy: true

  session_ttl: 720h
  tick_interval_ms: 200

storage:
  sqlite_path: "/data/trading.db"   # CONTAINER: the mounted volume

secrets_path: "/secrets/secrets.yaml"

recording:
  ticks: false

capture:
  enabled: true
  run_at: "15:40"
  interval: "5minute"
  strikes: 20
  expiries: 4
  lookback_days: 30
  underlyings:
    - name: "NIFTY"
      index: "NIFTY 50"
    - name: "SENSEX"
      index: "SENSEX"
  # NSE/BSE trading holidays. Equity and equity-derivative segments share one
  # list, so this serves both NFO and BFO capture.
  #
  # Weekends are handled structurally; these are not derivable and must be
  # listed. Getting one WRONG is asymmetric: an unlisted holiday costs a few
  # empty requests and a spurious login nag, while a date listed here that is
  # actually a trading day makes the capture SKIP it, and an expired contract's
  # candles cannot be fetched again afterwards. When in doubt, leave it out.
  #
  # 2026, verified against two independent published lists. Re-check against
  # nseindia.com/resources/exchange-communication-holidays each December, and
  # note that election holidays are announced mid-year — 15 Jan 2026 was one.
  holidays:
    - "2026-01-15"  # Maharashtra municipal elections
    - "2026-01-26"  # Republic Day
    - "2026-03-03"  # Holi
    - "2026-03-26"  # Shri Ram Navami
    - "2026-03-31"  # Shri Mahavir Jayanti
    - "2026-04-03"  # Good Friday
    - "2026-04-14"  # Dr Baba Saheb Ambedkar Jayanti
    - "2026-05-01"  # Maharashtra Day
    - "2026-05-28"  # Bakri Id
    - "2026-06-26"  # Muharram
    - "2026-09-14"  # Ganesh Chaturthi
    - "2026-10-02"  # Mahatma Gandhi Jayanti
    - "2026-10-20"  # Dussehra
    - "2026-11-10"  # Diwali Balipratipada
    - "2026-11-24"  # Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"  # Christmas
  # Note: Diwali Laxmi Pujan falls on Sunday 8 Nov 2026 with a special Muhurat
  # session. Weekends are skipped structurally, so that session is not captured.

# Outbound alerts. Optional, and off unless enabled.
#
# The daily Zerodha login is the one routine failure with permanent
# consequences: the token dies around 06:00 IST, the UI keeps serving pages as
# though nothing were wrong, and the 15:40 capture quietly does nothing.
# Contracts that expire that day take their price history with them.
notify:
  telegram:
    enabled: false
    # chat_id is a NUMBER, not an @name. Message @userinfobot to get yours.
    chat_id: ""
    # bot_token belongs in the SECRETS file, not here — it is a credential.
    # How long to wait before repeating an alert that is still unresolved.
    # 0 means say it once and stay quiet.
    repeat_every: 30m

risk:
  max_daily_loss: 5000
  # 0 = no limit. Sizing caps are off by choice; the daily loss cap is the
  # guardrail. The lot-MULTIPLE check still runs — it is validity, not sizing.
  max_open_positions: 0
  max_order_value: 0
  max_lots_per_trade: 0
  live:
    max_loss_pct: 1.0
    expiry_square_off_time: "15:00"
  paper:
    max_daily_loss: 25000
    # max_lots_per_trade unset on purpose: an override only applies when > 0,
    # so a value here would put the cap back on the simulated book.

strategies:
  - name: "short-straddle"
    enabled: true
    params:
      index_symbol: "NIFTY 50"
      underlying: "NIFTY"
      strike_step: 50
      lots: 1
      entry_start_time: "09:20"
      exit_delta: 0.25
      risk_free_rate: 0.06
      square_off_time: "15:15"
      product: "MIS"
