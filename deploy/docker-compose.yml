# kite-algo — single-box deployment.
#
# ONE app container. Never scale this service.
#
# The database is SQLite: one writer, one file. A second instance mounting the
# same volume corrupts it, and the damage is not obvious until a read comes back
# wrong. There is deliberately no `deploy.replicas` here, and `docker compose up
# --scale app=2` must never be run.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kite-algo:latest
    restart: unless-stopped

    # NOT published to the host. The only route in is through Caddy, on the
    # compose network. Publishing 8080 here would quietly bypass both the TLS
    # termination and the IP allowlist.
    expose:
      - "8080"

    volumes:
      # The database. This is the irreplaceable one: captured option candles
      # cannot be downloaded again once the contracts expire.
      - kite-data:/data
      # Config and secrets are mounted as DIRECTORIES, not as individual files.
      #
      # A single-file bind mount is resolved to an inode when the container is
      # created, and most editors save by writing a temporary file and renaming
      # it over the original — a new inode. The container keeps the old one, so
      # the file visibly changes on the host while the container goes on reading
      # the previous contents, surviving `docker compose restart` and every
      # other kind of restart short of recreating the container. That cost a
      # debugging session: an edited config.yaml that the app kept ignoring.
      #
      # Mounting the directory resolves the path per access instead, so a
      # replaced file is picked up the next time the process reads it.
      #
      # :Z relabels for SELinux. On RHEL-family hosts (Rocky, Alma, CentOS)
      # SELinux is enforcing by default and a plain bind mount is denied inside
      # the container — the app fails to read its own config with a permission
      # error that says nothing about SELinux. Harmless on Debian/Ubuntu, where
      # the label is simply ignored.
      #
      # live_confirm has no environment override by design, so a config file is
      # required to ever enable real trading.
      - ./conf:/etc/kite-algo:ro,Z
      # Kite credentials and the web password hash, read-only.
      - ./secrets:/secrets:ro,Z

    environment:
      TRADING_SECRETS_PATH: /secrets/secrets.yaml
      TZ: Asia/Kolkata

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app

    # Only 443. There is no ACME challenge to serve because the certificate
    # comes from Caddy's own internal CA, so port 80 is never needed and
    # publishing it would be one more thing exposed for no reason.
    ports:
      - "443:443"

    volumes:
      # A directory, for the same reason as conf/ and secrets/ above. This one
      # is tracked in git rather than edited by hand, and git also replaces
      # files by creating new ones — so a pull that changed the Caddyfile would
      # leave this container serving the old routing until it was recreated.
      - ./caddy:/etc/caddy:ro,Z
      - caddy-data:/data      # certificates — losing this re-issues them
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

    environment:
      # Set both in deploy/.env — see .env.example.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      ALLOWED_IPS: ${ALLOWED_IPS:?set ALLOWED_IPS in deploy/.env}

volumes:
  kite-data:
  caddy-data:
  caddy-config:
  caddy-logs:
