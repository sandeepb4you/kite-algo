# =============================================================================
# Trading platform configuration.
# Copy this file to config.yaml and edit. Secrets can also come from env vars
# (KITE_API_KEY, KITE_API_SECRET, KITE_ACCESS_TOKEN), which override the values
# here — preferred so credentials never sit in a checked-in file.
# =============================================================================

# Execution mode:
#   dryrun : no credentials, no network. Boots and idles (smoke test).
#   paper  : live market data, SIMULATED orders. Recommended for development.
#   live   : REAL orders — and even then only after confirming in the web UI.
#            Requires live_confirm: true below. The process still starts with a
#            simulated broker; nothing reaches the exchange until you type
#            "I UNDERSTAND" and re-enter your password in the UI.
mode: dryrun

# Logging. level: debug|info|warn|error. format: text|json
log:
  level: info
  format: text

# --- Zerodha Kite credentials -------------------------------------------------
# Get these from https://developers.kiteconnect.com/apps (api_key/api_secret).
#
# PREFER keeping them in the secrets file (see secrets_path above) or env vars,
# NOT here. The fields below are left empty by design — they're only a fallback.
# Precedence (highest wins): env vars > secrets file > here.
#
# access_token is OPTIONAL. The web UI performs the Zerodha login for you and
# stores the resulting token in the database, refreshing it each trading day.
# Only set it here if you are scripting a setup without a browser.
kite:
  api_key: ""
  api_secret: ""
  access_token: ""
  base_url: "https://api.kite.trade"
  ticker_url: "wss://ws.kite.trade"

# SAFETY: must be true to even attempt live mode (plus confirmation in the UI).
live_confirm: false

# --- Web UI -------------------------------------------------------------------
web:
  # Listen address. Keep this on loopback and put a TLS-terminating reverse
  # proxy (Caddy, or `tailscale serve`) in front — the app refuses to bind a
  # routable address unless a password is set.
  addr: "127.0.0.1:8080"

  # The URL you actually reach this server on. Used to build the Zerodha
  # redirect URL, which must be registered EXACTLY as <public_url>/kite/callback
  # in your Kite Connect app at https://developers.kiteconnect.com/apps
  # Zerodha matches it character for character and allows no wildcards.
  public_url: "http://127.0.0.1:8080"

  # Operator password hash. Do NOT write it here — run `tradebot -set-password`,
  # which stores it in your secrets file instead.
  password_hash: ""

  # How long a browser login lasts.
  session_ttl: 720h

  # Read the client IP from X-Forwarded-For. Enable ONLY behind a proxy you
  # control: otherwise anyone can spoof the header and defeat login lockout.
  trust_proxy: false

  # How often coalesced market-data frames are pushed to the browser. An option
  # chain ticks far faster than a screen can be read; 200ms (~5/sec) is plenty.
  tick_interval_ms: 200

# Path to a YAML secrets file OUTSIDE the repo holding Kite credentials.
# Default: ~/.trading/secrets.yaml (i.e. C:\Users\<you>\.trading\secrets.yaml).
# Create it with: ./tradebot -init-secrets
# Precedence (highest wins): env vars > secrets file > this config file.
# Set to "" to disable loading a secrets file entirely.
secrets_path: "~/.trading/secrets.yaml"

# Record every tick to the database? This is HUGE (lakhs of rows/day) — leave
# off unless you're collecting data for backtesting.
recording:
  ticks: false

# Daily option-candle capture.
#
# Kite sells no historical data for EXPIRED contracts: candles are keyed by
# instrument_token, and an expired option's token leaves the instrument master
# for good. A weekly option's data is buyable up to expiry and gone forever the
# day after. This job downloads it while the contracts are still alive — a day
# it does not run is a day of option data nobody can ever backtest.
#
# Cost, at the default settings: roughly 41 strikes x 2 sides x 4 expiries x 2
# underlyings, so about 650 historical requests a day. At Kite's 3/sec limit
# that is ~4 minutes of wall time and ~50k rows.
capture:
  enabled: false           # opt in: it spends your historical-data quota
  run_at: "15:40"          # IST, after the 15:30 close so the last bar is settled
  interval: "5minute"
  strikes: 20              # strikes captured EACH SIDE of the day's traded range
  expiries: 4              # how many expiries deep, nearest first
  lookback_days: 30        # first sighting of a contract reaches back this far;
                           # coverage means it is paid once, not daily
  underlyings:
    - name: "NIFTY"        # as it appears in the instrument master (NFO)
      index: "NIFTY 50"    # spot symbol that centres the strike window
    - name: "SENSEX"       # BSE — requires the BFO master, loaded automatically
      index: "SENSEX"
  # Weekends are skipped structurally. Holidays are not derivable — list them
  # or the job spends a few empty requests on each one.
  holidays: []

# SQLite database location. Directory is created if missing.
storage:
  sqlite_path: "./data/trading.db"

# Pre-trade risk limits. Tune to your capital and risk appetite.
risk:
  max_daily_loss: 5000          # rupees: halt NEW entries when day PnL <= -this
  max_open_positions: 5         # distinct open symbols
  max_order_value: 100000       # rupees per single order (qty * price)
  max_lots_per_trade: 1
  # Limits for the SIMULATED book, which runs alongside the real one: manual
  # orders can be routed to the exchange while every strategy stays on paper.
  # Unset fields inherit the real limits above.
  paper:
    max_daily_loss: 25000
    max_lots_per_trade: 10         # lots per order (1 lot NIFTY = 75, check current)

# Strategy default parameters.
#
# Strategies are NEVER started automatically — you start them from the
# /strategies page. These blocks only supply the defaults that page's form is
# pre-filled with, so a restart or a crash-loop can never begin trading
# unattended. `enabled` is retained for compatibility and has no effect on
# startup.
strategies:
  - name: "short-straddle"
    enabled: true
    params:
      index_symbol: "NIFTY 50"   # spot index to track (drives entry)
      underlying: "NIFTY"        # option underlying to trade
      strike_step: 50            # NIFTY grid (use 100 for BANKNIFTY)
      lots: 1                    # lots per leg (1 = 75 qty for NIFTY)
      exit_delta: 0.25           # square off when |net position delta| > this
      risk_free_rate: 0.06       # annualized, for Black-Scholes
      square_off_time: "15:15"   # flat by this IST time, regardless of delta
      product: "MIS"             # MIS (intraday) or NRML
